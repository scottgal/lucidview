name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'MarkdownViewer/MarkdownViewer.csproj'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # Without this, one platform failing cancels the others mid-run and their
      # results read as failures too. That happened: a Windows-only file-locking
      # bug cancelled the macOS job, which had already passed the step that
      # mattered, and the run looked like a two-platform failure.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Build
      run: dotnet build ${{ env.PROJECT_PATH }} -c Release --no-restore

    - name: Build LucidReader
      run: dotnet build LucidReader/LucidReader.csproj -c Release

    - name: Test LucidReader.Core.Tests
      run: dotnet test LucidReader.Core.Tests/LucidReader.Core.Tests.csproj --verbosity normal

    - name: Test MarkdownViewer.Tests
      run: dotnet test MarkdownViewer.Tests/MarkdownViewer.Tests.csproj --verbosity normal

    # MarkdownViewer.Full.Tests is deliberately NOT run here. The build-full job
    # already runs it, with the same filter, across the same three platforms.
    # Running it in both jobs only doubled the exposure to a flaky test without
    # adding coverage.

  build-full:
    name: Build FULL (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build FULL
        run: dotnet build MarkdownViewer.Full/MarkdownViewer.Full.csproj -c Debug
      # Single line on purpose: this job's matrix includes windows-latest, where
      # the default shell is pwsh and a trailing backslash is not a line
      # continuation. A multi-line form here has failed every Windows run.
      - name: Test FULL (skip heavy)
        run: dotnet test MarkdownViewer.Full.Tests/MarkdownViewer.Full.Tests.csproj -c Debug --filter "Category!=RequiresLlm&Category!=RequiresPlaywright"

  # Quick smoke test - ensure it can be published
  publish-test:
    runs-on: windows-latest
    needs: build

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Publish (Windows x64)
      shell: bash
      run: |
        dotnet publish ${{ env.PROJECT_PATH }} -c Release -r win-x64 \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true \
          -p:IncludeAllContentForSelfExtract=true \
          -p:PublishReadyToRun=true \
          -p:DebugType=none \
          -o publish/win-x64

    - name: Copy content files
      shell: bash
      run: |
        # Content files aren't in publish output with SingleFile - copy from source
        cp README.md publish/win-x64/ 2>/dev/null || true
        cp MarkdownViewer/default-settings.json publish/win-x64/ 2>/dev/null || true

    - name: Verify output
      shell: pwsh
      run: |
        if (Test-Path "publish/win-x64/lucidVIEW.exe") {
          $size = (Get-Item "publish/win-x64/lucidVIEW.exe").Length
          $sizeMb = [math]::Round($size / 1MB, 2)
          Write-Host "Build successful! Size: $sizeMb MB"
          Write-Host "Content files:"
          Get-ChildItem "publish/win-x64/*.json","publish/win-x64/*.md" -ErrorAction SilentlyContinue | Format-Table Name, Length
        } else {
          Write-Host "Build failed - lucidVIEW.exe not found"
          exit 1
        }
