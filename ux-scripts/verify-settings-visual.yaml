name: verify-settings-visual
description: Open settings dialog, screenshot each tab, no toggling (avoids the click-harness double-toggle issue on CheckBox)
default_delay: 200

actions:
  - type: Wait
    value: "1500"
    description: Wait for app startup

  - type: Click
    target: SettingsButton
    description: Open the settings dialog

  - type: Wait
    value: "400"

  - type: Screenshot
    value: 01-dialog-composite
    composite: true

  - type: Screenshot
    value: 02-updates-tab
    window_id: Settings

  - type: Click
    target: OfflineTabButton
    window_id: Settings

  - type: Screenshot
    value: 03-offline-tab
    window_id: Settings

  - type: Click
    target: RetentionTabButton
    window_id: Settings

  - type: Wait
    value: "600"

  - type: Screenshot
    value: 04-retention-tab
    window_id: Settings

  - type: Click
    target: ReadingTabButton
    window_id: Settings

  - type: Screenshot
    value: 05-reading-tab
    window_id: Settings

  - type: Click
    target: CancelButton
    window_id: Settings
