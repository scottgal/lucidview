name: verify-feed-settings-dialog
description: >
  Select a feed, open its settings from the toolbar, and verify the inherited
  labels and that a feed with no overrides opens with every switch off.

  The toolbar route is used rather than the sidebar context menu because a
  ContextMenu opens into its own PopupRoot: LocatorEngine resolves against a
  single window root and ScreenshotCapture only draws Popups found in the
  window's visual or logical tree, so the harness can neither click nor
  capture a context menu item. The Unsubscribe confirmation is reachable only
  from that context menu and so has no coverage here.
default_delay: 250

actions:
  - type: Wait
    value: "2000"
    description: Wait for app startup

  - type: Screenshot
    value: 00-main-window

  # MouseDown/MouseUp, not Click: the harness's Click on a non-Button control
  # only calls Focus() and never raises pointer events, and sidebar selection
  # is driven by PointerPressed on each row's Border. MouseDown/MouseUp go
  # through the real InputManager pipeline, so they select the row.
  - type: MouseDown
    target: "text='Alpha Feed'"
    button: left
    description: Select Alpha Feed, which enables the feed-scoped toolbar actions

  - type: MouseUp
    target: "text='Alpha Feed'"
    button: left

  - type: Wait
    value: "400"

  - type: Expect
    target: FeedSettingsButton
    matcher: IsEnabled
    description: Selecting a real feed must enable the button

  - type: Screenshot
    value: 01-feed-selected

  - type: Click
    target: FeedSettingsButton
    description: Open the per-feed settings dialog

  - type: Wait
    value: "400"
    description: Wait for the dialog to open and be tracked

  - type: Screenshot
    value: 02-feed-settings-dialog
    window_id: "Feed Settings"

  - type: Expect
    target: InheritedRefreshIntervalText
    window_id: "Feed Settings"
    matcher: HasText
    value: "Use the global setting (30 minutes)"

  - type: Expect
    target: InheritedAutoDownloadText
    window_id: "Feed Settings"
    matcher: HasText
    value: "Use the global setting (on)"

  - type: Expect
    target: OverrideRefreshIntervalCheck
    window_id: "Feed Settings"
    matcher: IsUnchecked
    description: Alpha Feed has no overrides yet, so every switch should open off

  - type: Click
    target: CancelButton
    window_id: "Feed Settings"
    description: Cancel without saving

  - type: Wait
    value: "400"

  - type: Screenshot
    value: 03-after-cancel
