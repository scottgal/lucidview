<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
    <!-- mylo application icon. The single source of truth: every raster the app
         and the macOS bundle use is generated from this file by
         LucidReader/icon/generate-icons.sh, so there is no binary blob here
         without a way to rebuild it.

         The mark is the same broadcast wave as the menu-bar status item in
         LucidReader/Assets/status-item.png, so the Dock icon, the window icon
         and the menu bar all read as one app. Two arcs and a dot survive being
         drawn at 16 pixels, which a wordmark would not. The blue is
         AccentSelectionColor from LucidReader/Styles/Reader.axaml. -->
    <rect width="1024" height="1024" rx="224" fill="#0A84FF"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="78" stroke-linecap="round">
        <path d="M 271.2 284.4 A 468.4 468.4 0 0 1 739.5 752.8"/>
        <path d="M 271.2 454.8 A 298 298 0 0 1 569.2 752.8"/>
    </g>
    <circle cx="336.8" cy="687.2" r="65.6" fill="#FFFFFF"/>
</svg>
